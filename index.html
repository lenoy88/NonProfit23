<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Support System Flyers</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      background: radial-gradient(ellipse at center, #363636, #151515 75%);
    }

    header { padding: 36px 16px 20px; }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.4rem);
      text-shadow: 0 3px 12px #000;
    }

    p { color: #ddd; }

    nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0 28px;
    }

    nav a {
      padding: 10px 18px;
      color: white;
      text-decoration: none;
      border: 1px solid #777;
      border-radius: 24px;
      background: #292929;
    }

    nav a:hover { background: #e6323b; }

    .flyers {
      display: grid;
      width: min(1200px, calc(100% - 28px));
      gap: 28px;
      margin: 0 auto 40px;
    }

    .flyer {
      margin: 0;
      padding: 12px;
      overflow: hidden;
      border: 2px solid #e6323b;
      border-radius: 16px;
      background: #f7f5f0;
      box-shadow: 0 12px 35px #0009;
    }

    .flyer img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .flyer figcaption {
      padding: 12px 6px 4px;
      color: #222;
      font-weight: bold;
    }

    #player-wrap {
      position: fixed;
      top: 0;
      left: -10000px;
      width: 200px;
      height: 113px;
      overflow: hidden;
    }

    #musicButton {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 3;
      padding: 13px 18px;
      color: white;
      font-weight: bold;
      border: 0;
      border-radius: 24px;
      background: #d92730;
      box-shadow: 0 4px 18px #0008;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <header>
    <h1>Family Support System</h1>
    <p>Community, hope, and support for families.</p>

    <nav>
      <a href="index.html">Home</a>
      <a href="photos.html">View Flyers</a>
    </nav>
  </header>

  <main class="flyers">
    <figure class="flyer">
      <img src="798.jpg" alt="Family Support System community business and partnership flyer">
      <figcaption>Community partnerships and support</figcaption>
    </figure>

    <figure class="flyer">
      <img src="797.png" alt="Bagz4Dakidz and Friends community gathering flyer">
      <figcaption>Community gathering and violence prevention</figcaption>
    </figure>
  </main>

  <button id="musicButton" type="button">Play music</button>
  <div id="player-wrap"><div id="yt-player"></div></div>

  <script>
    const VIDEO_ID = "YPsVWworsbc";
    const musicButton = document.getElementById("musicButton");
    let player;
    let playerReady = false;
    let playWhenReady = false;

    const apiScript = document.createElement("script");
    apiScript.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(apiScript);

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("yt-player", {
        width: "200",
        height: "113",
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 0,
          controls: 0,
          playsinline: 1
        },
        events: {
          onReady: function () {
            playerReady = true;
            if (playWhenReady) player.playVideo();
          },
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.PLAYING) {
              musicButton.textContent = "Pause music";
            } else {
              musicButton.textContent = "Play music";
            }
          },
          onError: function () {
            musicButton.textContent = "Music could not load";
          }
        }
      });
    };

    musicButton.addEventListener("click", function () {
      if (!playerReady) {
        playWhenReady = true;
        musicButton.textContent = "Loading music…";
        return;
      }

      if (player.getPlayerState() === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        playWhenReady = false;
        player.playVideo();
      }
    });
  </script>
</body>
</html>
