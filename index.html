<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Support Photos</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(145deg, #191919, #484442, #1c1b1b);
    }

    h1 { text-shadow: 0 3px 15px #000; }

    a {
      display: inline-block;
      margin: 10px;
      padding: 10px 18px;
      border-radius: 24px;
      color: white;
      background: #c91d26;
      text-decoration: none;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      width: min(100%, 1000px);
      margin: 28px auto;
    }

    .photo-grid img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border: 2px solid #c91d26;
      border-radius: 14px;
      background: #292929;
    }

    .note { color: #ddd; }
  </style>
</head>

<body>
  <h1>Family Support Photos</h1>
  <p class="note">Add your pictures in the photo grid below.</p>
  <a href="index.html">Back to Home</a>

  <div class="photo-grid">
    <!-- Add each picture here, replacing the filename with your image name:
    <img src="your-photo.jpg" alt="Family support photo">
    -->
  </div>
</body>
</html>
